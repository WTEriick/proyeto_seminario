<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAMESTORE - Iniciar Sesión</title>
    <link rel="stylesheet" href="estilos/estilo_global.css">
    <link rel="stylesheet" href="estilos/estilo_inicio.css">
</head>

<body>

    <div class="container">

        <div class="brand">
            <h1 class="logo">
                <span class="yellow">GAME</span>
                <span class="white">STORE</span>
            </h1>

            <p class="slogan">
                Tu destino definitivo de videojuegos
            </p>
        </div>


        <div class="login-card">

            <h2 class="title">
                Iniciar Sesión
            </h2>


            <form
                id="formLogin"
                action="php/procesar_login2.php"
                method="POST"
            >

                <!-- USUARIO O CORREO -->
                <div class="input-group">

                    <label for="username">
                        Email / Usuario
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="text"
                            id="username"
                            name="login_input"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- CONTRASEÑA -->
                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="contrasena"
                            autocomplete="current-password"
                            required
                        >


                        <span
                            class="toggle-password"
                            id="mostrarPassword"
                            title="Mostrar contraseña"
                        >

                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >

                                <path
                                    d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                                ></path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                ></circle>

                            </svg>

                        </span>

                    </div>

                </div>


                <!-- RECUPERAR CONTRASEÑA -->
                <a
                    href="#"
                    class="forgot-password"
                    id="btnOlvidePassword"
                >
                    ¿Olvidó su contraseña?
                </a>


                <!-- BOTÓN LOGIN -->
                <button
                    type="submit"
                    class="btn btn-primary"
                    id="btnLogin"
                >
                    Iniciar Sesión
                </button>


                <div class="divider">
                    o continúa con
                </div>


                <!-- CREAR CUENTA -->
                <button
                    type="button"
                    class="btn btn-secondary"
                    id="btnCrearCuenta"
                >
                    Crear cuenta nueva
                </button>

            </form>

        </div>


        <p class="footer-text">

            Al continuar aceptas nuestros
            Términos de Servicio y
            Política de Privacidad

        </p>

    </div>


    <!-- JAVASCRIPT -->

    <script src="javascript/inicio.js"></script>
    <script src="javascript/daltonismo.js"></script>

</body>

</html>
