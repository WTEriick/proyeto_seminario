<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interfaz web tienda GAMESTORE</title>
    <link rel="stylesheet" href="../estilos/estilo_global.css">
    <link rel="stylesheet" href="../estilos/estilo_registro.css">

</head>

<body>

<div class="wrapper">

<header class="header">

<h1 class="logo">GAME<span class="logo-white">STORE</span></h1>

<p class="submite">Únete a la comunidad gamer</p>

</header>

<main class="form-container">

<h2 class="form-title">

Crear Cuenta

</h2>

<form action="../php/procesar_registro.php" method="POST">

<div class="input-group">

<label>NICKNAME</label>

<input
type="text"
name="usuario"
placeholder="nubmaster69"
required>

</div>

<div class="input-group">

<label>EMAIL</label>

<input
type="email"
name="correo"
placeholder="correo@gmail.com"
required>

</div>

<div class="input-group">

<label>CONTRASEÑA</label>

<input
type="password"
name="password"
placeholder="********"
required>

</div>

<div class="input-group">

<label>CONFIRMAR CONTRASEÑA</label>

<input
type="password"
name="confirmar_password"
required>

</div>

<div class="checkbox-group">

<input type="checkbox" required>

<label>

Acepto los términos y condiciones.

</label>

</div>

<button type="submit" class="btn-submit">

Registrarme

</button>

</form>

<div class="form-footer">

<p>

¿Ya tienes una cuenta?

<a href="inicios_sesion.html">

Iniciar sesión

</a>

</p>

</div>

</main>

</div>

<script src="../javascript/registro.js"></script>
<script src="../javascript/daltonismo.js"></script>

</body>

</html>
