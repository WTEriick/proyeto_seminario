<!DOCTYPE html>
<html>
    <head>
        <title>Interfaz web tienda GAMESTORE</title>
        <link rel="stylesheet" href="C:\Users\juare\OneDrive\Escritorio\Proyecto_seminario\estilos\estilo_registro.css"
    </head>
    <body>
        <div class="wrapper">
            <header class="header">
                <h1 class="logo">GAME<span class="logo-white">STORE</span></h1>
                <p class="submite">Unete a la cumunidad gamer</p>
            </header>
            <main class="form-container">
            <h2 class="form-title">Crear Cuenta</h2>

            <form action="#" method="POST">
                <div class="input-group">
                    <label for="nickname">NICKNAME</label>
                    <input type="text" id="nickname" placeholder="nubmaster69" required>
                </div>

                <div class="input-group">
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>

                <div class="input-group">
                    <label for="password">CONTRASEÑA</label>
                    <input type="password" id="password" placeholder="" required>
                </div>

                <div class="input-group">
                    <label for="confirm-password">CONFIRMAR CONTRASEÑA</label>
                    <input type="password" id="confirm-password" placeholder="" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        Acepto los <a href="#">Términos y Condiciones</a> y la <a href="#">Política de Privacidad</a>
                    </label>
                </div>

                <button type="submit" class="btn-submit">Registrarme</button>
            </form>

            <div class="form-footer">
                <p>¿Ya tienes cuenta? <a href="#">Iniciar sesión</a></p>
            </div>
        </main>
     </div>
        </div>
    </body>
</html>
