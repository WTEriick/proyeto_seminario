<!DOCTYPE html>
<html lang="es">
<head>
    <title>GAMESTORE - Iniciar Sesión</title>
    <link rel="stylesheet" href="C:\Users\juare\OneDrive\Escritorio\Proyecto_seminario\estilos\estilo_inicio.css">
</head>
<body>
    <div class="container">
        
        <div class="brand">
            <h1 class="logo"><span class="yellow">GAME</span><span class="white">STORE</span></h1>
            <p class="slogan">Tu destino definitivo de videojuegos</p>
        </div>

        <div class="login-card">
            <h2 class="title">Iniciar Sesión</h2>
            
            <form onsubmit="event.preventDefault();">
                <div class="input-group">
                    <label for="username">Email / Usuario</label>
                    <div class="input-wrapper">
                        <input type="email" id="username" placeholder=""required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" value=""required>
                        <span class="toggle-password">
                            <svg xmlnst="htp://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </span>
                    </div>
                </div>

                <a href="#" class="forgot-password">¿Olvidó su contraseña?</a>

                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                
                <div class="divider">o continúa con</div>

                <button type="button" class="btn btn-secondary">Crear cuenta nueva</button>
            </form>
        </div>

        <p class="footer-text">
            Al continuar aceptas nuestros Términos de Servicio y Política de Privacidad
        </p>
    </div>

</body>
</html>
