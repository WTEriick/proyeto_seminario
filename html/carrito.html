<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAMESTORE | Carrito</title>
    <link rel="stylesheet" href="../estilos/estilo_global.css">
    <link rel="stylesheet" href="..\estilos\estilo_carrito.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!--====================-->
    <!-- BARRA SUPERIOR -->
    <!--====================-->

    <header class="navbar">

        <div class="logo">
            <span class="game">GAME</span><span class="store">STORE</span>
        </div>

        <nav>

            <a href="menu.html">
                Tienda
            </a>

            <a href="#">
                Categorías
            </a>

            <a href="#">
                Ofertas
            </a>

        </nav>

        <div class="barra-derecha">

            <input
            type="text"
            placeholder="Buscar juegos..."
            class="buscar">

            <div class="iconos">

                <span id="contadorCarrito">
                    0
                </span>

                <i class="fa-solid fa-cart-shopping"></i>

                <i class="fa-regular fa-user"></i>

            </div>

        </div>

    </header>

    <!--====================-->
    <!-- CONTENIDO -->
    <!--====================-->

    <main class="contenedor">

        <!--====================-->
        <!-- CARRITO VACÍO -->
        <!--====================-->

        <section id="carritoVacio">

            <div class="vacio">

                <div class="circulo">

                    <i class="fa-solid fa-cart-shopping"></i>

                </div>

                <h2>
                    Tu carrito está vacío
                </h2>

                <p>
                    Agrega algunos juegos para continuar
                </p>

                <button id="btnExplorar">

                    Explorar tienda

                </button>

            </div>

        </section>

        <!--====================-->
        <!-- CARRITO CON PRODUCTOS -->
        <!--====================-->

        <section id="carritoContenido">

            <div class="izquierda">

                <div class="titulo">

                    <h1>

                        <i class="fa-solid fa-cart-shopping"></i>

                        Carrito de Compras

                    </h1>

                    <span id="cantidadArticulos">

                        0 artículos

                    </span>

                </div>

                <!-- AQUÍ JAVASCRIPT INSERTARÁ LOS PRODUCTOS -->

                <div id="listaCarrito">

                </div>

                <a href="menu.html" class="seguir">

                    <i class="fa-solid fa-chevron-left"></i>

                    Seguir comprando

                </a>

            </div>

            <!--====================-->
            <!-- RESUMEN -->
            <!--====================-->

            <aside class="resumen">

                <h2>

                    Resumen del pedido

                </h2>

                <div class="linea">

                    <span>

                        Subtotal

                    </span>

                    <span id="subtotal">

                        $0.00

                    </span>

                </div>

                <div class="linea">

                    <span>

                        Envío estándar

                    </span>

                    <span id="envio">

                        $4.99

                    </span>

                </div>

                <hr>

                <div class="linea total">

                    <span>

                        Total

                    </span>

                    <span id="total">

                        $0.00

                    </span>

                </div>

                <button id="btnPago">

                    <i class="fa-regular fa-credit-card"></i>

                    Proceder al Pago

                </button>

                <p class="seguro">

                    <i class="fa-solid fa-shield-halved"></i>

                    Pago 100% seguro y encriptado

                </p>

            </aside>

        </section>

    </main>

    <script src="..\javascript\carrito.js"></script>
    <script src="../javascript/daltonismo.js"></script>
</body>
</html>
